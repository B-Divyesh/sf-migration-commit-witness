<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="title desc"><title id="title">Recorded mcw demo terminal run</title><desc id="desc">A real bundled CLI sample detects a partial commit, restores the rollback value, and writes witness files in a temporary directory.</desc><rect width="760" height="380" fill="#090b09"/><rect x="18" y="18" width="724" height="344" fill="#121512" stroke="#596157"/><circle cx="42" cy="39" r="6" fill="#ff9b74"/><circle cx="62" cy="39" r="6" fill="#f4ca72"/><circle cx="82" cy="39" r="6" fill="#b7d879"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16"><text x="36" y="58" fill="#dbe6d3">$ mcw demo</text><text x="36" y="100" fill="#ff9b74">DEMO: partial commit detected; rollback restored the starting checks.</text><text x="36" y="142" fill="#dbe6d3">Workspace: /tmp/mcw-demo-&lt;run&gt;</text><text x="36" y="184" fill="#dbe6d3">JSON: /tmp/mcw-demo-&lt;run&gt;/witness/witness.json</text><text x="36" y="226" fill="#dbe6d3">Markdown: /tmp/mcw-demo-&lt;run&gt;/witness/witness.md</text><text x="36" y="268" fill="#dbe6d3">Sample data is isolated in this temporary workspace. Delete it when</text><text x="36" y="310" fill="#dbe6d3">finished.</text></g></svg>